<!DOCTYPE html>
<html lang="bg">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="auth.reset_password_title">Reset Password - RemontCo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/assets/css/styles.css">
</head>

<body style="background: linear-gradient(135deg, #dbeafe 0%, #ddd6fe 100%); min-height: 100vh;">
    <div id="navbar-container"></div>

    <main>
        <section class="py-5">
            <div class="container">
                <div class="row justify-content-center">
                    <div class="col-md-6 col-lg-5">
                        <div class="card shadow-lg border-0"
                            style="box-shadow: 0 20px 60px rgba(0,0,0,0.3) !important; border: 1px solid rgba(255, 255, 255, 0.1) !important;">
                            <div class="card-body p-5">
                                <div class="text-center mb-4">
                                    <h1 class="h3 mb-3 fw-bold">
                                        <i class="bi bi-house-check-fill text-primary me-2"></i>
                                        RemontCo
                                    </h1>
                                    <h2 class="h5 text-muted" data-i18n="auth.new_password_title">Нова Парола</h2>
                                    <p class="small text-muted" data-i18n="auth.reset_password_desc">Въведете новата си
                                        парола по-долу.</p>
                                </div>

                                <div id="alert-container"></div>

                                <div id="loadingContainer" class="text-center py-4">
                                    <div class="spinner-border text-primary" role="status">
                                        <span class="visually-hidden">Loading...</span>
                                    </div>
                                    <p class="mt-2 text-muted" data-i18n="common.loading">Зареждане...</p>
                                </div>

                                <div id="formContainer" class="d-none">
                                    <form id="resetPasswordForm">
                                        <div class="mb-3">
                                            <label for="newPassword" class="form-label"
                                                data-i18n="auth.new_password">Нова парола</label>
                                            <div class="input-group">
                                                <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                                                <input type="password" class="form-control" id="newPassword" required
                                                    minlength="6" data-i18n-placeholder="auth.password_placeholder">
                                            </div>
                                        </div>

                                        <div class="mb-4">
                                            <label for="confirmPassword" class="form-label"
                                                data-i18n="auth.confirm_new_password">Потвърди новата парола</label>
                                            <div class="input-group">
                                                <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                                                <input type="password" class="form-control" id="confirmPassword"
                                                    required minlength="6" placeholder="Повтори паролата">
                                            </div>
                                        </div>

                                        <button type="submit" class="btn btn-primary w-100 mb-3" id="submitBtn">
                                            <span class="spinner-border spinner-border-sm me-2 d-none"
                                                id="spinner"></span>
                                            <i class="bi bi-check-circle me-2"></i>
                                            <span data-i18n="auth.update_password">Запази новата парола</span>
                                        </button>
                                    </form>

                                    <div class="text-center mt-3">
                                        <a href="/auth/login.html" class="text-decoration-none">
                                            <i class="bi bi-arrow-left me-1"></i>
                                            <span data-i18n="auth.back_to_login">Обратно към Вход</span>
                                        </a>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <div class="modal fade" id="successModal" tabindex="-1" aria-labelledby="successModalTitle" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-success text-white border-0">
                    <h5 class="modal-title" id="successModalTitle">
                        <i class="bi bi-check-circle-fill me-2"></i>
                        Успешно!
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                        aria-label="Close"></button>
                </div>
                <div class="modal-body text-center py-4">
                    <i class="bi bi-shield-lock-fill text-success" style="font-size: 4rem;"></i>
                    <p class="mt-3 mb-0" id="successModalMessage">Паролата е променена успешно.</p>
                </div>
                <div class="modal-footer border-0 justify-content-center">
                    <button type="button" class="btn btn-success px-4" data-bs-dismiss="modal">
                        <i class="bi bi-box-arrow-in-right me-2"></i>
                        <span data-i18n="auth.go_to_login">Към Вход</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="/src/pages/reset-password.js"></script>
</body>

</html>
