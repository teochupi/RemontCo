<!DOCTYPE html>
<html lang="bg">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="auth.forgot_password_title">Forgot Password - RemontCo</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css">
  <link rel="stylesheet" href="/assets/css/styles.css">
</head>

<body style="background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 100%); min-height: 100vh;">
  <div id="navbar-container"></div>

  <main>
    <section class="py-5">
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-md-6 col-lg-5">
            <div class="card shadow-lg border-0"
              style="box-shadow: 0 20px 60px rgba(0,0,0,0.3) !important; border: 1px solid rgba(255, 255, 255, 0.1) !important;">
              <div class="card-body p-5">
                <div class="text-center mb-4">
                  <h1 class="h3 mb-3 fw-bold">
                    <i class="bi bi-house-check-fill text-primary me-2"></i>
                    RemontCo
                  </h1>
                  <h2 class="h5 text-muted" data-i18n="auth.forgot_password_title">Forgot Password</h2>
                  <p class="small text-muted" data-i18n="auth.forgot_password_desc">Enter your email and we'll send you a reset link.</p>
                </div>

                <div id="alert-container"></div>

                <form id="forgotPasswordForm">
                  <div class="mb-4">
                    <label for="email" class="form-label" data-i18n="auth.email">Email</label>
                    <input type="email" class="form-control" id="email" required>
                  </div>

                  <button type="submit" class="btn btn-primary w-100 mb-3" id="submitBtn">
                    <span class="spinner-border spinner-border-sm me-2 d-none" id="spinner"></span>
                    <span data-i18n="auth.send_reset_link">Send Link</span>
                  </button>

                  <div class="text-center">
                    <a href="/auth/login.html" class="text-decoration-none small" data-i18n="auth.back_to_login">
                      Back to Login
                    </a>
                  </div>
                </form>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="/src/pages/forgot-password.js"></script>
</body>

</html>
