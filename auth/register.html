<!DOCTYPE html>
<html lang="bg">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - RemontCo</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css">
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/Logo_Chupetlov_2.png">
  <link rel="stylesheet" href="/assets/css/styles.css">
  <style>
    .register-card {
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .register-header {
      background: rgba(15, 23, 42, 0.1);
      /* Subtle dark overlay */
      background: linear-gradient(135deg, var(--primary-dark) 0%, #1e1b4b 100%);
      color: white;
      padding: 2.5rem 2rem;
      text-align: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .register-header h1 {
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }

    .register-header p {
      opacity: 0.9;
      margin: 0;
    }

    .register-body {
      padding: 2.5rem 2rem;
    }

    .type-selector {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .type-btn {
      position: relative;
      padding: 1.25rem;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      background: white;
      cursor: pointer;
      transition: all 0.3s ease;
      text-align: center;
    }

    .type-btn:hover {
      border-color: #667eea;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.2);
    }

    .type-btn input[type="radio"] {
      position: absolute;
      opacity: 0;
    }

    .type-btn input[type="radio"]:checked+.type-content {
      color: var(--primary);
    }

    .type-btn input[type="radio"]:checked~.type-indicator {
      background: var(--primary);
      transform: scale(1);
    }

    .type-btn:has(input[type="radio"]:checked) {
      border-color: var(--primary);
      background: #f5f3ff;
      box-shadow: 0 4px 12px rgba(67, 56, 202, 0.15);
    }

    .type-indicator {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: transparent;
      border: 2px solid #e2e8f0;
      transform: scale(0);
      transition: all 0.3s ease;
    }

    .type-content i {
      font-size: 2rem;
      display: block;
      margin-bottom: 0.5rem;
    }

    .form-control,
    .form-select {
      padding: 0.75rem 1rem;
      border-radius: 10px;
      border: 2px solid #e2e8f0;
      transition: all 0.3s ease;
    }

    .form-control:focus,
    .form-select:focus {
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    .form-label {
      font-weight: 600;
      color: #334155;
      margin-bottom: 0.5rem;
    }

    .btn-submit {
      padding: 0.875rem;
      border-radius: 10px;
      font-weight: 600;
      font-size: 1.05rem;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      border: none;
      transition: all 0.3s ease;
    }

    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(67, 56, 202, 0.4);
    }

    .form-check-input:checked {
      background-color: var(--primary);
      border-color: var(--primary);
    }

    .alert-info {
      background: #f0f9ff;
      border: 1px solid #bae6fd;
      border-radius: 10px;
      color: #0369a1;
    }
  </style>
</head>

<body style="background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 100%); min-height: 100vh;">
  <div id="navbar-container"></div>

  <main>
    <section class="py-5">
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-md-10 col-lg-8 col-xl-7">
            <div class="register-card">
              <div class="register-header">
                <h1>
                  <i class="bi bi-house-check-fill me-2"></i>
                  RemontCo
                </h1>
                <p id="formTitle" data-i18n="auth.sign_up">Create Your Account</p>
              </div>

              <div class="register-body">
                <!-- Type Selector -->
                <div class="type-selector">
                  <label class="type-btn">
                    <input type="radio" name="userType" id="typeConsumer" value="consumer" checked>
                    <div class="type-content">
                      <i class="bi bi-person"></i>
                      <div data-i18n="auth.register_consumer">Consumer</div>
                    </div>
                    <span class="type-indicator"></span>
                  </label>

                  <label class="type-btn">
                    <input type="radio" name="userType" id="typeCompany" value="company">
                    <div class="type-content">
                      <i class="bi bi-building"></i>
                      <div data-i18n="auth.register_company">Company</div>
                    </div>
                    <span class="type-indicator"></span>
                  </label>
                </div>

                <div id="alert-container"></div>

                <!-- Consumer Form -->
                <form id="consumerForm" class="registration-form">
                  <div class="row">
                    <div class="col-md-6 mb-3">
                      <label for="consumerFirstName" class="form-label" data-i18n="auth.first_name">First Name</label>
                      <input type="text" class="form-control" id="consumerFirstName" required>
                    </div>
                    <div class="col-md-6 mb-3">
                      <label for="consumerLastName" class="form-label" data-i18n="auth.last_name">Last Name</label>
                      <input type="text" class="form-control" id="consumerLastName" required>
                    </div>
                  </div>

                  <div class="mb-3">
                    <label for="consumerEmail" class="form-label" data-i18n="auth.email">Email</label>
                    <input type="email" class="form-control" id="consumerEmail" required>
                  </div>

                  <div class="mb-3">
                    <label for="consumerUsername" class="form-label" data-i18n="auth.username">Username</label>
                    <input type="text" class="form-control" id="consumerUsername" required
                      pattern="^[a-zA-Z0-9_]{3,20}$" title="3-20 characters, letters, numbers, and underscores only.">
                  </div>

                  <div class="mb-3">
                    <label for="consumerPhone" class="form-label" data-i18n="auth.phone">Phone</label>
                    <input type="tel" class="form-control" id="consumerPhone">
                  </div>

                  <div class="mb-3">
                    <label for="consumerPassword" class="form-label" data-i18n="auth.password">Password</label>
                    <input type="password" class="form-control" id="consumerPassword" required minlength="6">
                  </div>

                  <div class="mb-4">
                    <label for="consumerConfirmPassword" class="form-label" data-i18n="auth.confirm_password">Confirm
                      Password</label>
                    <input type="password" class="form-control" id="consumerConfirmPassword" required>
                  </div>

                  <div class="mb-3 form-check">
                    <input type="checkbox" class="form-check-input" id="consumerLegal18" required>
                    <label class="form-check-label" for="consumerLegal18" data-i18n="auth.legal_18">I confirm that I am
                      at least 18 years old</label>
                  </div>
                  <div class="mb-4 form-check">
                    <input type="checkbox" class="form-check-input" id="consumerLegalTerms" required>
                    <label class="form-check-label" for="consumerLegalTerms" data-i18n="auth.legal_terms">I accept the
                      Terms and Conditions and Privacy Policy</label>
                  </div>

                  <button type="submit" class="btn btn-primary btn-submit w-100">
                    <span class="spinner-border spinner-border-sm me-2 d-none" id="consumerSpinner"></span>
                    <span data-i18n="auth.sign_up">Sign Up</span>
                  </button>
                </form>

                <!-- Company Form -->
                <form id="companyForm" class="registration-form d-none">
                  <div class="mb-3">
                    <label for="companyName" class="form-label" data-i18n="auth.company_name">Company Name</label>
                    <input type="text" class="form-control" id="companyName" required>
                  </div>

                  <div class="row">
                    <div class="col-md-6 mb-3">
                      <label for="companyEIK" class="form-label" data-i18n="auth.eik">EIK/BULSTAT</label>
                      <input type="text" class="form-control" id="companyEIK" required pattern="[0-9]{9,13}">
                      <small class="text-muted" data-i18n="auth.eik_hint">9-13 digits</small>
                    </div>
                    <div class="col-md-6 mb-3">
                      <label for="companyCity" class="form-label" data-i18n="auth.city">City</label>
                      <input type="text" class="form-control" id="companyCity" required>
                    </div>
                  </div>

                  <div class="mb-3">
                    <label for="companyAddress" class="form-label" data-i18n="auth.address">Address</label>
                    <input type="text" class="form-control" id="companyAddress" required>
                  </div>

                  <div class="row">
                    <div class="col-md-6 mb-3">
                      <label for="companyPhone" class="form-label" data-i18n="auth.phone">Phone</label>
                      <input type="tel" class="form-control" id="companyPhone" required>
                    </div>
                    <div class="col-md-6 mb-3">
                      <label for="companyEmail" class="form-label" data-i18n="auth.email">Email</label>
                      <input type="email" class="form-control" id="companyEmail" required>
                    </div>
                  </div>

                  <div class="mb-3">
                    <label for="companyUsername" class="form-label" data-i18n="auth.username">Username</label>
                    <input type="text" class="form-control" id="companyUsername" required pattern="^[a-zA-Z0-9_]{3,20}$"
                      title="3-20 characters, letters, numbers, and underscores only.">
                  </div>

                  <div class="mb-3">
                    <label for="companyPassword" class="form-label" data-i18n="auth.password">Password</label>
                    <input type="password" class="form-control" id="companyPassword" required minlength="6">
                  </div>

                  <div class="mb-4">
                    <label for="companyConfirmPassword" class="form-label" data-i18n="auth.confirm_password">Confirm
                      Password</label>
                    <input type="password" class="form-control" id="companyConfirmPassword" required>
                  </div>

                  <div class="mb-3 form-check">
                    <input type="checkbox" class="form-check-input" id="companyLegal18" required>
                    <label class="form-check-label" for="companyLegal18" data-i18n="auth.legal_18">I confirm that I am
                      at least 18 years old</label>
                  </div>
                  <div class="mb-4 form-check">
                    <input type="checkbox" class="form-check-input" id="companyLegalTerms" required>
                    <label class="form-check-label" for="companyLegalTerms" data-i18n="auth.legal_terms">I accept the
                      Terms and Conditions and Privacy Policy</label>
                  </div>

                  <div class="alert alert-info mb-4">
                    <i class="bi bi-info-circle me-2"></i>
                    <small data-i18n="auth.company_verification_note">Your company will be verified by our admin team
                      before approval.</small>
                  </div>

                  <button type="submit" class="btn btn-primary btn-submit w-100">
                    <span class="spinner-border spinner-border-sm me-2 d-none" id="companySpinner"></span>
                    <span data-i18n="auth.sign_up">Sign Up</span>
                  </button>
                </form>

                <div class="mt-4 pt-3 border-top text-center">
                  <p class="text-muted mb-3" data-i18n="auth.have_account">Already have an account?</p>
                  <a href="/auth/login.html" class="btn btn-outline-secondary w-100" style="border-radius: 10px;">
                    <span data-i18n="auth.sign_in">Sign In</span>
                  </a>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="/src/pages/register.js"></script>
</body>

</html>
