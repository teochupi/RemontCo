<!DOCTYPE html>
<html lang="bg">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация - RemontCo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
</head>

<body class="bg-light">
    <div class="container mt-5 mb-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card p-4 shadow-lg border-0">
                    <div class="text-center mb-4">
                        <a href="/" class="h3 text-decoration-none fw-bold text-primary">RemontCo</a>
                        <p class="text-muted mt-2">Създайте своя професионален профил</p>
                    </div>
                    <form id="register-form">
                        <div class="mb-3">
                            <label class="form-label">Тип на акаунта</label>
                            <select id="user-role" class="form-select" required>
                                <option value="consumer">Частно лице (Клиент)</option>
                                <option value="company">Фирма (Изпълнител)</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Имена / Име на фирма</label>
                            <input type="text" class="form-control" id="name" required>
                        </div>

                        <!-- Поле за ЕИК, което се показва само за фирми -->
                        <div id="company-fields" class="d-none">
                            <div class="mb-3">
                                <label class="form-label">ЕИК / БУЛСТАТ</label>
                                <input type="text" class="form-control" id="uic">
                                <small class="text-muted">Задължително за юридически лица</small>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Имейл адрес</label>
                            <input type="email" class="form-control" id="email" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Парола</label>
                            <input type="password" class="form-control" id="password" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-2">Създай акаунт</button>
                    </form>
                    <div class="mt-3 text-center">
                        <small>Вече имате профил? <a href="/auth/login.html">Влезте оттук</a></small>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        // Динамично показване на полетата за фирма
        const roleSelect = document.getElementById('user-role');
        const companyFields = document.getElementById('company-fields');

        roleSelect.addEventListener('change', (e) => {
            if (e.target.value === 'company') {
                companyFields.classList.remove('d-none');
                document.getElementById('uic').setAttribute('required', '');
            } else {
                companyFields.classList.add('d-none');
                document.getElementById('uic').removeAttribute('required');
            }
        });
    </script>
    <script type="module" src="/src/js/register.js"></script>
    <script type="module" src="/main.js"></script>
</body>

</html>
