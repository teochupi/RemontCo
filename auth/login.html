<!DOCTYPE html>
<html lang="bg">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход - RemontCo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
</head>

<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card p-4 shadow-lg border-0">
                    <div class="text-center mb-4">
                        <a href="/" class="h3 text-decoration-none fw-bold text-primary">RemontCo</a>
                        <p class="text-muted mt-2" data-i18n="login_welcome">Добре дошли отново!</p>
                    </div>
                    <form id="login-form">
                        <div class="mb-3">
                            <label class="form-label" data-i18n="email_label">Имейл адрес</label>
                            <input type="email" class="form-control" id="email" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" data-i18n="password_label">Парола</label>
                            <input type="password" class="form-control" id="password" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-2" data-i18n="btn_login">Влез</button>
                    </form>
                    <div class="mt-3 text-center">
                        <small>Нямате профил? <a href="/auth/register.html" data-i18n="link_register">Регистрирайте се
                                тук</a></small>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script type="module" src="/src/js/login.js"></script>
    <script type="module" src="/main.js"></script>
</body>

</html>
