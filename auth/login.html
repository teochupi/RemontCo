<!DOCTYPE html>
<html lang="bg">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - RemontCo</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css">
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/Logo_Chupetlov_2.png">
  <link rel="stylesheet" href="/assets/css/styles.css">
</head>

<body style="background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 100%); min-height: 100vh;">
  <div id="navbar-container"></div>

  <main>
    <section class="py-5">
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-md-6 col-lg-5">
            <div class="card shadow-lg border-0"
              style="box-shadow: 0 20px 60px rgba(0,0,0,0.3) !important; border: 1px solid rgba(255, 255, 255, 0.1) !important;">
              <div class="card-body p-5">
                <div class="text-center mb-4">
                  <h1 class="h3 mb-3 fw-bold">
                    <i class="bi bi-house-check-fill text-primary me-2"></i>
                    RemontCo
                  </h1>
                  <p class="text-muted" data-i18n="auth.sign_in">Sign In</p>
                </div>

                <div id="alert-container"></div>

                <form id="loginForm">
                  <div class="mb-3">
                    <label for="email" class="form-label" data-i18n="auth.email_or_username">Email or Username</label>
                    <input type="text" class="form-control" id="email" required
                      data-i18n-placeholder="auth.identifier_placeholder" autocomplete="username">
                  </div>

                  <div class="mb-3">
                    <label for="password" class="form-label" data-i18n="auth.password">Password</label>
                    <input type="password" class="form-control" id="password" required
                      data-i18n-placeholder="auth.password_placeholder" autocomplete="current-password">
                  </div>

                  <div class="mb-3 form-check">
                    <input type="checkbox" class="form-check-input" id="rememberMe">
                    <label class="form-check-label" for="rememberMe" data-i18n="auth.remember_me">
                      Remember me
                    </label>
                  </div>

                  <button type="submit" class="btn btn-primary w-100 mb-3" id="submitBtn">
                    <span class="spinner-border spinner-border-sm me-2 d-none" id="spinner"></span>
                    <span data-i18n="auth.sign_in">Sign In</span>
                  </button>

                  <div class="text-center">
                    <a href="/auth/forgot-password.html" class="text-decoration-none small"
                      data-i18n="auth.forgot_password">
                      Forgot password?
                    </a>
                  </div>
                </form>

                <hr class="my-4">

                <div class="text-center">
                  <p class="mb-2" data-i18n="auth.no_account">Don't have an account?</p>
                  <a href="/auth/register.html" class="btn btn-outline-primary w-100 mb-2">
                    <i class="bi bi-person-plus me-2"></i>
                    <span data-i18n="auth.register_consumer">Register as Consumer</span>
                  </a>
                  <a href="/auth/register.html?type=company" class="btn btn-outline-secondary w-100">
                    <i class="bi bi-building me-2"></i>
                    <span data-i18n="auth.register_company">Register as Company</span>
                  </a>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="/src/pages/login.js"></script>
</body>

</html>
