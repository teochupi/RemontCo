<!DOCTYPE html>
<html lang="bg">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="dashboard_consumer.title">Consumer Dashboard - RemontCo</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="/assets/css/styles.css">
</head>

<body class="bg-light">
  <!-- Navigation -->
  <div id="navbar-container"></div>

  <div class="container py-5 mt-5">
    <div class="row">
      <!-- Sidebar/Stat Column -->
      <div class="col-lg-3">
        <div class="card shadow-sm border-0 mb-4 sticky-top" style="top: 100px;">
          <div class="card-body">
            <div class="text-center mb-3">
              <div class="avatar-circle mx-auto mb-2">
                <i class="bi bi-person-circle fs-1 text-primary"></i>
              </div>
              <h5 id="username" class="mb-0">Loading...</h5>
              <p class="text-muted small" data-i18n="roles.consumer">Consumer</p>
            </div>
            <hr>
            <div class="nav flex-column nav-pills" id="v-pills-tab" role="tablist" aria-orientation="vertical">
              <button class="nav-link active text-start" id="v-pills-jobs-tab" data-bs-toggle="pill"
                data-bs-target="#v-pills-jobs" type="button" role="tab">
                <i class="bi bi-briefcase me-2"></i> <span data-i18n="dashboard_consumer.my_jobs">My Job Postings</span>
              </button>
              <button class="nav-link text-start" id="v-pills-post-tab" data-bs-toggle="pill"
                data-bs-target="#v-pills-post" type="button" role="tab">
                <i class="bi bi-plus-circle me-2"></i> <span data-i18n="dashboard_consumer.post_job">Post a New
                  Job</span>
              </button>
              <button class="nav-link text-start" id="v-pills-profile-tab" data-bs-toggle="pill"
                data-bs-target="#v-pills-profile" type="button" role="tab">
                <i class="bi bi-person me-2"></i> <span data-i18n="dashboard_consumer.profile">Profile Settings</span>
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- Main Content -->
      <div class="col-lg-9">
        <div class="tab-content" id="v-pills-tabContent">
          <!-- My Jobs Tab -->
          <div class="tab-pane fade show active" id="v-pills-jobs" role="tabpanel">
            <div class="d-flex justify-content-between align-items-center mb-4">
              <h2 class="h4 mb-0" data-i18n="dashboard_consumer.active_jobs">Your Active Requests</h2>
              <button class="btn btn-primary d-lg-none" onclick="document.getElementById('v-pills-post-tab').click()">
                <i class="bi bi-plus-lg"></i>
              </button>
            </div>

            <div id="jobs-list" class="row g-4">
              <!-- Jobs will be injected here -->
              <div class="col-12 text-center py-5">
                <div class="spinner-border text-primary" role="status">
                  <span class="visually-hidden">Loading...</span>
                </div>
              </div>
            </div>
          </div>

          <!-- Post Job Tab -->
          <div class="tab-pane fade" id="v-pills-post" role="tabpanel">
            <h2 class="h4 mb-4" data-i18n="dashboard_consumer.post_title">Describe Your Project</h2>
            <div class="card shadow-sm border-0">
              <div class="card-body">
                <form id="post-job-form">
                  <div class="row g-3">
                    <div class="col-md-12">
                      <label class="form-label" data-i18n="job_form.title">Project Title</label>
                      <input type="text" class="form-control" id="job-title" required
                        data-i18n-placeholder="job_form.title_placeholder">
                    </div>
                    <div class="col-md-6">
                      <label class="form-label" data-i18n="job_form.category">Category</label>
                      <select class="form-select" id="job-category" required>
                        <option value="" data-i18n="job_form.select_category">Select Category</option>
                        <!-- Categories injected from DB -->
                      </select>
                    </div>
                    <div class="col-md-6">
                      <label class="form-label" data-i18n="job_form.location">Location (City)</label>
                      <input type="text" class="form-control" id="job-location" required
                        data-i18n-placeholder="job_form.location_placeholder">
                    </div>
                    <div class="col-12">
                      <label class="form-label" data-i18n="job_form.description">Description</label>
                      <textarea class="form-control" id="job-description" rows="5" required
                        data-i18n-placeholder="job_form.description_placeholder"></textarea>
                    </div>
                    <div class="col-md-6">
                      <label class="form-label" data-i18n="job_form.budget">Estimated Budget (Optional)</label>
                      <div class="input-group">
                        <input type="number" class="form-control" id="job-budget">
                        <span class="input-group-text">EUR</span>
                      </div>
                    </div>
                    <div class="col-md-6">
                      <label class="form-label" data-i18n="job_form.urgency">Urgency</label>
                      <select class="form-select" id="job-urgency">
                        <option value="low" data-i18n="urgency.low">Not urgent</option>
                        <option value="medium" data-i18n="urgency.medium" selected>Standard (2-4 weeks)</option>
                        <option value="high" data-i18n="urgency.high">Urgent (As soon as possible)</option>
                      </select>
                    </div>
                    <div class="col-12 mt-4">
                      <button type="submit" class="btn btn-primary px-5 btn-lg">
                        <i class="bi bi-send me-2"></i> <span data-i18n="job_form.submit">Post Project</span>
                      </button>
                    </div>
                  </div>
                </form>
              </div>
            </div>
          </div>

          <!-- Profile Settings Tab -->
          <div class="tab-pane fade" id="v-pills-profile" role="tabpanel">
            <div class="card shadow-sm border-0">
              <div class="card-body p-4">
                <form id="profile-form" class="mb-4">
                  <div class="row g-3">
                    <div class="col-md-6">
                      <label class="form-label" data-i18n="auth.first_name">First Name</label>
                      <input type="text" class="form-control" id="profile-first-name" required>
                    </div>
                    <div class="col-md-6">
                      <label class="form-label" data-i18n="auth.last_name">Last Name</label>
                      <input type="text" class="form-control" id="profile-last-name" required>
                    </div>
                    <div class="col-md-12">
                      <label class="form-label" data-i18n="auth.phone">Phone</label>
                      <input type="tel" class="form-control" id="profile-phone">
                    </div>
                    <div class="col-12 mt-4">
                      <button type="submit" class="btn btn-primary px-4">
                        <i class="bi bi-save me-2"></i> <span data-i18n="common.save">Save Changes</span>
                      </button>
                    </div>
                  </div>
                </form>

                <hr class="my-4">

                <h3 class="h5 mb-3">Акаунт</h3>
                <button id="logout-btn-profile" class="btn btn-outline-danger">
                  <i class="bi bi-box-arrow-right me-2"></i> <span data-i18n="auth.sign_out">Log out</span>
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Footer (will be injected) -->
  <div id="footer-container"></div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="/src/pages/consumer_dashboard.js"></script>
</body>

</html>
