<!DOCTYPE html>
<html lang="bg">

<head>
    <meta charset="UTF-8">
    <title>Клиентски панел - RemontCo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
</head>

<body>
    <div class="container py-5">
        <h1>Добре дошли, <span id="user-name">Клиент</span></h1>
        <p>Тук можете да управлявате вашите поръчки за ремонт.</p>
        <hr>
        <div class="row">
            <div class="col-md-4">
                <div class="card p-3">
                    <h5>Активни запитвания</h5>
                    <h2>0</h2>
                </div>
            </div>
        </div>
        <button id="logout-btn" class="btn btn-danger mt-4">Изход</button>
    </div>
    <script type="module">
        import { authService } from '/src/js/services/authService.js';
        document.getElementById('logout-btn').addEventListener('click', async () => {
            await authService.signOut();
            window.location.href = '/';
        });
    </script>
</body>

</html>
