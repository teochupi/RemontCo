<!DOCTYPE html>
<html lang="bg">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="dashboard_consumer.title">Потребителско Табло - RemontCo</title>
  <script src="/refresh-redirect.js"></script>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="/assets/css/styles.css">
</head>

<body class="bg-light">
  <!-- Navigation -->
  <div id="navbar-container"></div>

  <div class="container py-5 mt-5">
    <div id="alert-container"></div>
    <div class="row">
      <!-- Sidebar/Stat Column -->
      <div class="col-lg-3">
        <div class="card shadow-sm border-0 mb-4 sticky-top" style="top: 100px;">
          <div class="card-body">
            <div class="text-center mb-3">
              <div class="avatar-circle mx-auto mb-2 overflow-hidden rounded-circle border shadow-sm position-relative"
                style="width: 80px; height: 80px;" id="sidebar-avatar-container">
                <img id="sidebar-avatar-img" src="" alt="Avatar" class="w-100 h-100 object-fit-cover d-none">
                <div id="sidebar-avatar-icon"
                  class="w-100 h-100 d-flex align-items-center justify-content-center bg-light text-primary">
                  <i class="bi bi-person-circle fs-1"></i>
                </div>
              </div>
              <h5 id="username" class="mb-0">Loading...</h5>
              <p class="text-muted small" data-i18n="roles.consumer">Потребител</p>
            </div>
            <hr>
            <div class="nav flex-column nav-pills" id="v-pills-tab" role="tablist" aria-orientation="vertical">
              <button class="nav-link active text-start" id="v-pills-jobs-tab" data-bs-toggle="pill"
                data-bs-target="#v-pills-jobs" type="button" role="tab">
                <i class="bi bi-briefcase me-2"></i> <span data-i18n="dashboard_consumer.my_jobs">Моите обяви</span>
              </button>
              <button class="nav-link text-start" id="v-pills-post-tab" data-bs-toggle="pill"
                data-bs-target="#v-pills-post" type="button" role="tab">
                <i class="bi bi-plus-circle me-2"></i> <span data-i18n="dashboard_consumer.post_job">Публикувай
                  обява</span>
              </button>
              <button class="nav-link text-start" id="v-pills-profile-tab" data-bs-toggle="pill"
                data-bs-target="#v-pills-profile" type="button" role="tab">
                <i class="bi bi-person me-2"></i> <span data-i18n="dashboard_consumer.profile">Настройки на
                  профила</span>
              </button>
              <button class="nav-link text-start d-none" id="v-pills-companies-tab" data-bs-toggle="pill"
                data-bs-target="#v-pills-companies" type="button" role="tab">
                <i class="bi bi-building me-2"></i> <span data-i18n="nav.companies">Проверени фирми</span>
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- Main Content -->
      <div class="col-lg-9">
        <div class="tab-content" id="v-pills-tabContent">
          <!-- My Jobs Tab -->
          <div class="tab-pane fade show active" id="v-pills-jobs" role="tabpanel">
            <div class="d-flex flex-column flex-md-row align-items-center justify-content-between gap-3 mb-4">
              <h2 class="h4 mb-0" data-i18n="dashboard_consumer.active_jobs">Вашите активни запитвания</h2>
              <div class="d-flex flex-wrap align-items-center gap-2 w-100 w-md-auto ms-auto">
                <!-- Search Input -->
                <div class="input-group flex-grow-1 flex-md-grow-0" style="min-width: 200px;">
                  <span class="input-group-text bg-white border-end-0 rounded-start-pill ps-3">
                    <i class="bi bi-search text-primary"></i>
                  </span>
                  <input type="text" class="form-control border-start-0 rounded-end-pill" id="search-filter"
                    placeholder="Търсене по ключова дума..." data-i18n-placeholder="common.search_placeholder">
                </div>

                <!-- Category Filter -->
                <div class="input-group flex-grow-1 flex-md-grow-0" style="min-width: 180px;">
                  <span class="input-group-text bg-white border-end-0 rounded-start-pill ps-3">
                    <i class="bi bi-tags text-primary"></i>
                  </span>
                  <select class="form-select border-start-0 rounded-end-pill" id="category-filter"
                    style="cursor: pointer;">
                    <option value="" data-i18n="company.all_categories">Всички Категории</option>
                  </select>
                </div>

                <!-- City Filter -->
                <div class="input-group flex-grow-1 flex-md-grow-0" style="min-width: 150px;">
                  <span class="input-group-text bg-white border-end-0 rounded-start-pill ps-3">
                    <i class="bi bi-geo-alt text-primary"></i>
                  </span>
                  <select class="form-select border-start-0 rounded-end-pill" id="city-filter" style="cursor: pointer;">
                    <option value="" data-i18n="company.all_cities">Всички Градове</option>
                  </select>
                </div>

                <button class="btn btn-primary d-lg-none" onclick="document.getElementById('v-pills-post-tab').click()">
                  <i class="bi bi-plus-lg"></i>
                </button>
              </div>
            </div>

            <div id="jobs-list" class="row g-4">
              <!-- Jobs will be injected here -->
              <div class="col-12 text-center py-5">
                <div class="spinner-border text-primary" role="status">
                  <span class="visually-hidden">Loading...</span>
                </div>
              </div>
            </div>
          </div>

          <!-- Post Job Tab -->
          <div class="tab-pane fade" id="v-pills-post" role="tabpanel">
            <h2 class="h4 mb-4" data-i18n="dashboard_consumer.post_title">Опишете вашия проект</h2>
            <div class="card shadow-sm border-0">
              <div class="card-body">
                <form id="post-job-form">
                  <div class="row g-3">
                    <div class="col-md-12">
                      <label class="form-label" data-i18n="job_form.title">Заглавие на проекта</label>
                      <input type="text" class="form-control" id="job-title" required
                        data-i18n-placeholder="job_form.title_placeholder">
                    </div>
                    <div class="col-md-6">
                      <label class="form-label" data-i18n="job_form.category">Категория</label>
                      <select class="form-select" id="job-category" required>
                        <option value="" data-i18n="job_form.select_category">Изберете категория</option>
                        <!-- Categories injected from DB -->
                      </select>
                    </div>
                    <div class="col-md-6">
                      <label class="form-label" data-i18n="job_form.location">Местоположение (Град)</label>
                      <select class="form-select" id="job-location" required>
                        <option value="" data-i18n="company.select_city">Изберете град</option>
                      </select>
                    </div>
                    <div class="col-12">
                      <label class="form-label" data-i18n="job_form.description">Описание</label>
                      <textarea class="form-control" id="job-description" rows="5" required
                        data-i18n-placeholder="job_form.description_placeholder"></textarea>
                    </div>
                    <div class="col-md-6">
                      <label class="form-label" data-i18n="job_form.budget">Приблизителен бюджет (по избор)</label>
                      <div class="input-group mb-2">
                        <input type="number" class="form-control" id="job-budget">
                        <span class="input-group-text">EUR</span>
                      </div>
                      <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="job-budget-negotiable">
                        <label class="form-check-label small" for="job-budget-negotiable"
                          data-i18n="job_form.budget_negotiable">
                          По договаряне
                        </label>
                      </div>
                    </div>
                    <div class="col-md-6">
                      <label class="form-label" data-i18n="job_form.urgency">Спешност</label>
                      <select class="form-select" id="job-urgency">
                        <option value="low" data-i18n="urgency.low">Не е спешно</option>
                        <option value="medium" data-i18n="urgency.medium" selected>Стандартно (2-4 седмици)</option>
                        <option value="high" data-i18n="urgency.high">Спешно (Възможно най-скоро)</option>
                      </select>
                    </div>
                    <div class="col-12 mt-4">
                      <button type="submit" class="btn btn-primary px-5 btn-lg">
                        <i class="bi bi-send me-2"></i> <span data-i18n="job_form.submit">Публикувай обявата</span>
                      </button>
                    </div>
                  </div>
                </form>
              </div>
            </div>
          </div>

          <!-- Profile Settings Tab -->
          <div class="tab-pane fade" id="v-pills-profile" role="tabpanel">
            <div class="card shadow-sm border-0">
              <div class="card-body p-4">
                <form id="profile-form" class="mb-4">
                  <div class="row g-3">
                    <div class="col-12 text-center mb-3">
                      <div class="position-relative d-inline-block">
                        <div
                          class="avatar-circle-lg mx-auto overflow-hidden rounded-circle border border-3 border-light shadow-sm"
                          style="width: 120px; height: 120px; background-color: #e9ecef; cursor: pointer;"
                          id="profile-avatar-container">
                          <img id="profile-avatar-img" src="" alt="Avatar" class="w-100 h-100 object-fit-cover d-none">
                          <div id="profile-avatar-icon"
                            class="w-100 h-100 d-flex align-items-center justify-content-center text-secondary">
                            <i class="bi bi-person text-secondary" style="font-size: 4rem;"></i>
                          </div>
                          <div
                            class="position-absolute top-0 start-0 w-100 h-100 bg-dark bg-opacity-50 d-flex align-items-center justify-content-center opacity-0 hover-opacity-100 transition-opacity rounded-circle">
                            <i class="bi bi-camera-fill text-white fs-2"></i>
                          </div>
                        </div>
                        <p class="text-muted small mt-2 mb-0" data-i18n="auth.change_avatar">Промяна на снимка</p>
                      </div>
                    </div>
                    <div class="col-md-6">
                      <label class="form-label" data-i18n="auth.first_name">Име</label>
                      <input type="text" class="form-control" id="profile-first-name">
                    </div>
                    <div class="col-md-6">
                      <label class="form-label" data-i18n="auth.last_name">Фамилия</label>
                      <input type="text" class="form-control" id="profile-last-name">
                    </div>
                    <div class="col-md-12">
                      <label class="form-label" data-i18n="auth.phone">Телефон</label>
                      <input type="tel" class="form-control" id="profile-phone">
                    </div>
                    <div class="col-12 mt-4">
                      <button type="submit" class="btn btn-primary px-4">
                        <i class="bi bi-save me-2"></i> <span data-i18n="common.save">Запази промените</span>
                      </button>
                    </div>
                  </div>
                </form>

                <hr class="my-4">

                <h3 class="h5 mb-3" data-i18n="dashboard.consumer.account">Акаунт</h3>
                <div class="d-flex flex-wrap gap-2">
                  <button id="change-password-btn" class="btn btn-outline-primary">
                    <i class="bi bi-key-fill me-2"></i> <span data-i18n="auth.change_password">Смяна на парола</span>
                  </button>
                  <button id="logout-btn-profile" class="btn btn-outline-danger">
                    <i class="bi bi-box-arrow-right me-2"></i> <span data-i18n="auth.sign_out">Изход</span>
                  </button>
                </div>
              </div>
            </div>
          </div>

          <!-- Companies Tab (Demo) -->
          <div class="tab-pane fade" id="v-pills-companies" role="tabpanel">
            <h2 class="h4 mb-4" data-i18n="dashboard.consumer.recommended_companies">Препоръчани фирми</h2>
            <div id="demo-companies-list" class="row g-4">
              <!-- Data injected via JS -->
              <div class="col-12 text-center py-5">
                <div class="spinner-border text-primary" role="status"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Hidden Avatar Upload Input -->
  <input type="file" id="avatar-input" class="d-none" accept="image/png, image/jpeg, image/webp">

  <!-- Footer (will be injected) -->
  <div id="footer-container"></div>

  <div class="modal fade" id="editJobModal" tabindex="-1" aria-labelledby="editJobModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content border-0 shadow-lg rounded-4">
        <div class="modal-header bg-primary text-white p-4">
          <h5 class="modal-title fw-bold" id="editJobModalLabel">
            <i class="bi bi-pencil-square me-2"></i> <span data-i18n="ads.edit">Редактиране</span>
          </h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <form id="edit-job-form">
          <div class="modal-body p-4">
            <input type="hidden" id="edit-job-id">
            <div class="row g-3">
              <div class="col-md-12">
                <label class="form-label fw-bold" data-i18n="job_form.title">Заглавие на проекта</label>
                <input type="text" class="form-control" id="edit-job-title" required>
              </div>
              <div class="col-md-6">
                <label class="form-label fw-bold" data-i18n="job_form.category">Категория</label>
                <select class="form-select" id="edit-job-category" required>
                  <!-- Categories will be injected -->
                </select>
              </div>
              <div class="col-md-6">
                <label class="form-label fw-bold" data-i18n="job_form.location">Местоположение (Град)</label>
                <select class="form-select" id="edit-job-location" required>
                  <option value="" data-i18n="company.select_city">Изберете град</option>
                </select>
              </div>
              <div class="col-12">
                <label class="form-label fw-bold" data-i18n="job_form.description">Описание</label>
                <textarea class="form-control" id="edit-job-description" rows="5" required></textarea>
              </div>
              <div class="col-md-12">
                <label class="form-label fw-bold" data-i18n="job_form.budget">Приблизителен бюджет (EUR)</label>
                <div class="input-group mb-2">
                  <input type="number" class="form-control" id="edit-job-budget">
                  <span class="input-group-text">EUR</span>
                </div>
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="edit-job-budget-negotiable">
                  <label class="form-check-label small" for="edit-job-budget-negotiable"
                    data-i18n="job_form.budget_negotiable">
                    По договаряне
                  </label>
                </div>
              </div>
            </div>
            <div class="alert alert-warning mt-4 mb-0 border-0 shadow-sm rounded-3">
              <i class="bi bi-info-circle me-2"></i>
              <span data-i18n="ads.edit_approval_warning">След промяна, обявата ще бъде изпратена отново за одобрение от
                администратор.</span>
            </div>
          </div>
          <div class="modal-footer border-0 p-4">
            <button type="button" class="btn btn-light px-4" data-bs-dismiss="modal"
              data-i18n="common.cancel">Отказ</button>
            <button type="submit" class="btn btn-primary px-4 bg-gradient-primary" data-i18n="common.save">Запази
              промените</button>
          </div>
        </form>
      </div>
    </div>
  </div>
  <!-- Offers Modal -->
  <div class="modal fade" id="offersModal" tabindex="-1" aria-labelledby="offersModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
      <div class="modal-content border-0 shadow-lg rounded-4">
        <div class="modal-header bg-success text-white p-4">
          <h5 class="modal-title fw-bold" id="offersModalLabel">
            <i class="bi bi-chat-left-dots me-2"></i> Получени Оферти
          </h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body p-4 bg-light">
          <div id="offers-container">
            <!-- Offers injected here -->
          </div>
        </div>
        <div class="modal-footer border-0 p-4">
          <button type="button" class="btn btn-primary px-4" data-bs-dismiss="modal"
            data-i18n="common.close">Затвори</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Change Password Modal -->
  <div class="modal fade" id="changePasswordModal" tabindex="-1" aria-labelledby="changePasswordModalLabel"
    aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header bg-primary text-white border-0">
          <h5 class="modal-title" id="changePasswordModalLabel">
            <i class="bi bi-key-fill me-2"></i>
            <span data-i18n="auth.change_password">Смяна на парола</span>
          </h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body p-4">
          <div id="password-alert-container"></div>
          <form id="changePasswordForm">
            <div class="mb-3">
              <label for="currentPassword" class="form-label" data-i18n="auth.current_password">Текуща парола</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                <input type="password" class="form-control" id="currentPassword" required>
              </div>
            </div>
            <div class="mb-3">
              <label for="newPasswordModal" class="form-label" data-i18n="auth.new_password">Нова парола</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                <input type="password" class="form-control" id="newPasswordModal" required minlength="6"
                  data-i18n-placeholder="auth.password_placeholder">
              </div>
            </div>
            <div class="mb-4">
              <label for="confirmNewPassword" class="form-label" data-i18n="auth.confirm_new_password">Потвърди новата
                парола</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                <input type="password" class="form-control" id="confirmNewPassword" required minlength="6">
              </div>
            </div>
            <button type="submit" class="btn btn-primary w-100" id="savePasswordBtn">
              <span class="spinner-border spinner-border-sm me-2 d-none" id="passwordSpinner"></span>
              <i class="bi bi-check-circle me-2"></i>
              <span data-i18n="auth.save_new_password">Запази новата парола</span>
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="/src/pages/consumer_dashboard.js"></script>
</body>

</html>
