<!DOCTYPE html>
<html lang="bg">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="admin.title">Админ Панел - RemontCo</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="/assets/css/styles.css">
  <style>
    .alert-soft-danger {
      background-color: #fff5f5;
      color: #e53e3e;
      border-color: #feb2b2;
    }

    .nav-pills .nav-link {
      border-radius: 12px;
      padding: 12px 20px;
      margin-bottom: 5px;
      color: #64748b;
      font-weight: 500;
      transition: all 0.2s;
    }

    .nav-pills .nav-link:hover {
      background-color: #f1f5f9;
    }

    .nav-pills .nav-link.active {
      background-color: #0d6efd;
      box-shadow: 0 4px 12px rgba(13, 110, 253, 0.25);
    }
  </style>
</head>

<body class="bg-light">
  <!-- Navigation -->
  <div id="navbar-container"></div>

  <div class="container py-5 mt-5">
    <div class="row g-4">
      <!-- Sidebar -->
      <div class="col-lg-3">
        <div class="card shadow-sm border-0 rounded-4 sticky-top" style="top: 100px;">
          <div class="card-body p-4">
            <h5 class="fw-bold mb-4 d-flex align-items-center" data-i18n="admin.title">
              <i class="bi bi-shield-lock me-2 text-primary"></i> Админ Панел
            </h5>
            <div class="nav flex-column nav-pills" id="admin-tab" role="tablist">
              <button class="nav-link active text-start" data-bs-toggle="pill" data-bs-target="#admin-jobs"
                type="button">
                <i class="bi bi-briefcase me-2"></i> <span data-i18n="admin.pending_jobs">Чакащи Обяви</span>
              </button>
              <button class="nav-link text-start" data-bs-toggle="pill" data-bs-target="#admin-companies" type="button">
                <i class="bi bi-building-check me-2"></i> <span data-i18n="admin.pending_companies">Верификация на
                  фирми</span>
              </button>
              <button class="nav-link text-start" data-bs-toggle="pill" data-bs-target="#admin-stats" type="button">
                <i class="bi bi-graph-up me-2"></i> <span data-i18n="admin.system_stats">Статистика</span>
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- Main Content -->
      <div class="col-lg-9">
        <div class="tab-content" id="admin-tabContent">
          <!-- Pending Jobs Tab -->
          <div class="tab-pane fade show active" id="admin-jobs" role="tabpanel">
            <div class="d-flex justify-content-between align-items-center mb-4">
              <h2 class="h4 fw-bold mb-0" data-i18n="admin.pending_jobs">Обяви чакащи одобрение</h2>
            </div>
            <div id="pending-jobs-list" class="row g-3">
              <div class="col-12 text-center py-5">
                <div class="spinner-border text-primary" role="status"></div>
              </div>
            </div>
          </div>

          <!-- Verify Companies Tab -->
          <div class="tab-pane fade" id="admin-companies" role="tabpanel">
            <h2 class="h4 fw-bold mb-4" data-i18n="admin.pending_companies">Верификация на фирми</h2>
            <div class="table-responsive bg-white rounded-4 shadow-sm p-4 border">
              <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                  <tr>
                    <th class="border-0 rounded-start" data-i18n="admin.table.company">Фирма</th>
                    <th class="border-0" data-i18n="admin.table.eik">ЕИК/БУЛСТАТ</th>
                    <th class="border-0" data-i18n="admin.table.city">Град</th>
                    <th class="border-0" data-i18n="admin.table.status">Статус</th>
                    <th class="border-0 rounded-end" data-i18n="admin.table.action">Действие</th>
                  </tr>
                </thead>
                <tbody id="pending-companies-table">
                  <tr>
                    <td colspan="5" class="text-center py-5">
                      <div class="spinner-border text-primary" role="status"></div>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>

          <!-- Stats Tab -->
          <div class="tab-pane fade" id="admin-stats" role="tabpanel">
            <h2 class="h4 fw-bold mb-4" data-i18n="admin.system_stats">Системна статистика</h2>
            <div class="row g-4">
              <div class="col-md-4">
                <div class="card border-0 shadow-sm rounded-4 p-4 card-stats">
                  <div class="d-flex justify-content-between align-items-center mb-3">
                    <div class="stat-icon bg-primary-subtle text-primary rounded-3 p-2">
                      <i class="bi bi-people fs-4"></i>
                    </div>
                  </div>
                  <h3 id="stat-users" class="fw-bold mb-1">0</h3>
                  <p class="text-muted mb-0 small uppercase" data-i18n="admin.total_users">Всички потребители</p>
                </div>
              </div>
              <div class="col-md-4">
                <div class="card border-0 shadow-sm rounded-4 p-4 card-stats">
                  <div class="d-flex justify-content-between align-items-center mb-3">
                    <div class="stat-icon bg-info-subtle text-info rounded-3 p-2">
                      <i class="bi bi-briefcase fs-4"></i>
                    </div>
                  </div>
                  <h3 id="stat-jobs" class="fw-bold mb-1">0</h3>
                  <p class="text-muted mb-0 small uppercase" data-i18n="admin.total_jobs">Всички обяви</p>
                </div>
              </div>
              <div class="col-md-4">
                <div class="card border-0 shadow-sm rounded-4 p-4 card-stats">
                  <div class="d-flex justify-content-between align-items-center mb-3">
                    <div class="stat-icon bg-success-subtle text-success rounded-3 p-2">
                      <i class="bi bi-building fs-4"></i>
                    </div>
                  </div>
                  <h3 id="stat-companies" class="fw-bold mb-1">0</h3>
                  <p class="text-muted mb-0 small uppercase" data-i18n="admin.total_companies">Фирми</p>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="moderationModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content border-0 shadow-lg rounded-4">
        <div class="modal-header bg-danger text-white p-4">
          <h5 class="modal-title fw-bold" id="moderationModalLabel">
            <i class="bi bi-exclamation-triangle me-2"></i> Модериране
          </h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body p-4">
          <input type="hidden" id="moderation-id">
          <input type="hidden" id="moderation-type">
          <label class="form-label fw-bold">Причина за връщане за редакция:</label>
          <textarea class="form-control" id="moderation-reason" rows="4"
            placeholder="Опишете какво трябва да се коригира..."></textarea>
          <div class="form-text mt-2 text-muted">
            Потребителят ще види тази причина и ще може да направи корекции.
          </div>
        </div>
        <div class="modal-footer border-0 p-4">
          <button type="button" class="btn btn-light px-4" data-bs-dismiss="modal">Отказ</button>
          <button type="button" id="confirm-moderation-btn" class="btn btn-danger px-4">Върни за редакция</button>
        </div>
      </div>
    </div>
  </div>

  <div id="footer-container"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="/src/pages/admin_dashboard.js"></script>
</body>

</html>
