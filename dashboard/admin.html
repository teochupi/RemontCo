<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="dashboard_admin.title">Admin Panel - RemontCo</title>
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="/assets/css/styles.css">
</head>
<body class="bg-light">
  <!-- Navigation -->
  <div id="navbar-container"></div>
  
  <div class="container py-5 mt-5">
    <div class="row">
      <!-- Sidebar -->
      <div class="col-lg-3">
        <div class="card shadow-sm border-0 mb-4 sticky-top" style="top: 100px;">
          <div class="card-body">
            <h5 class="mb-3" data-i18n="dashboard.admin.title">Admin Panel</h5>
            <hr>
            <div class="nav flex-column nav-pills" id="admin-tab" role="tablist">
              <button class="nav-link active text-start" data-bs-toggle="pill" data-bs-target="#admin-companies" type="button">
                <i class="bi bi-building-check me-2"></i> <span data-i18n="dashboard.admin.pending_companies">Verify Companies</span>
              </button>
              <button class="nav-link text-start" data-bs-toggle="pill" data-bs-target="#admin-stats" type="button">
                <i class="bi bi-graph-up me-2"></i> <span>System Stats</span>
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- Main Content -->
      <div class="col-lg-9">
        <div class="tab-content" id="admin-tabContent">
          <!-- Verify Companies Tab -->
          <div class="tab-pane fade show active" id="admin-companies" role="tabpanel">
            <h2 class="h4 mb-4">Pending Company Verifications</h2>
            <div class="table-responsive bg-white rounded shadow-sm p-3">
              <table class="table table-hover align-middle">
                <thead class="table-light">
                  <tr>
                    <th>Company Name</th>
                    <th>EIK/BULSTAT</th>
                    <th>City</th>
                    <th>Status</th>
                    <th>Action</th>
                  </tr>
                </thead>
                <tbody id="pending-companies-table">
                  <tr>
                    <td colspan="5" class="text-center py-4">
                      <div class="spinner-border text-primary" role="status"></div>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>

          <!-- Stats Tab -->
          <div class="tab-pane fade" id="admin-stats" role="tabpanel">
            <h2 class="h4 mb-4">Platform Overview</h2>
            <div class="row g-4">
              <div class="col-md-4">
                <div class="card border-0 shadow-sm text-center p-3">
                  <h3 id="stat-users">0</h3>
                  <p class="text-muted mb-0">Total Users</p>
                </div>
              </div>
              <div class="col-md-4">
                <div class="card border-0 shadow-sm text-center p-3">
                  <h3 id="stat-jobs">0</h3>
                  <p class="text-muted mb-0">Total Jobs</p>
                </div>
              </div>
              <div class="col-md-4">
                <div class="card border-0 shadow-sm text-center p-3">
                  <h3 id="stat-companies">0</h3>
                  <p class="text-muted mb-0">Companies</p>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="footer-container"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="/src/pages/admin_dashboard.js"></script>
</body>
</html>
