<!DOCTYPE html>
<html lang="bg">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="dashboard_company.title">Фирмено Табло - RemontCo</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="/assets/css/styles.css">
</head>

<body class="bg-light">
  <!-- Navigation -->
  <div id="navbar-container"></div>

  <div class="container py-5 mt-5">
    <div class="row">
      <!-- Sidebar -->
      <div class="col-lg-3">
        <div class="card shadow-sm border-0 mb-4 sticky-top" style="top: 100px;">
          <div class="card-body">
            <div class="text-center mb-3">
              <div class="avatar-circle mx-auto mb-2 text-primary">
                <i class="bi bi-building fs-1"></i>
              </div>
              <h5 id="company-name" class="mb-0">Loading...</h5>
              <p id="verification-badge" class="mt-2 mb-0"></p>
            </div>
            <hr>
            <div class="nav flex-column nav-pills" id="v-pills-tab" role="tablist">
              <button class="nav-link active text-start" id="v-pills-browse-tab" data-bs-toggle="pill"
                data-bs-target="#v-pills-browse" type="button" role="tab">
                <i class="bi bi-search me-2"></i> <span data-i18n="dashboard_company.browse_ads">Намери Работа</span>
              </button>
              <button class="nav-link text-start" id="v-pills-offers-tab" data-bs-toggle="pill"
                data-bs-target="#v-pills-offers" type="button" role="tab">
                <i class="bi bi-send-check me-2"></i> <span data-i18n="dashboard_company.my_offers">Моите Оферти</span>
              </button>
              <button class="nav-link text-start" id="v-pills-projects-tab" data-bs-toggle="pill"
                data-bs-target="#v-pills-projects" type="button" role="tab">
                <i class="bi bi-tools me-2"></i> <span data-i18n="dashboard_company.active_projects">Активни
                  Проекти</span>
              </button>
              <button class="nav-link text-start" id="v-pills-profile-tab" data-bs-toggle="pill"
                data-bs-target="#v-pills-profile" type="button" role="tab">
                <i class="bi bi-person-lines-fill me-2"></i> <span data-i18n="dashboard_company.profile">Редактиране на
                  профил</span>
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- Main Content -->
      <div class="col-lg-9">
        <!-- Status Notification -->
        <div id="status-notification"></div>

        <div class="tab-content" id="v-pills-tabContent">
          <!-- Browse Jobs Tab -->
          <div class="tab-pane fade show active" id="v-pills-browse" role="tabpanel">
            <h2 class="h4 mb-4" data-i18n="dashboard_company.available_jobs">Свободни Проекти</h2>
            <div id="available-jobs-list" class="row g-4">
              <!-- Jobs injected here -->
              <div class="col-12 text-center py-5">
                <div class="spinner-border text-primary" role="status"></div>
              </div>
            </div>
          </div>

          <!-- My Offers Tab -->
          <div class="tab-pane fade" id="v-pills-offers" role="tabpanel">
            <h2 class="h4 mb-4" data-i18n="dashboard_company.my_offers_title">Вашите Изпратени Оферти</h2>
            <div id="company-offers-list" class="row g-4">
              <p class="text-muted">Loading your offers...</p>
            </div>
          </div>
          <!-- Watchlist Tab -->
          <div class="tab-pane fade" id="v-pills-projects" role="tabpanel">
            <h2 class="h4 mb-4" data-i18n="dashboard_company.active_projects">Наблюдавани обяви</h2>
            <div id="favorites-list" class="row g-4">
              <div class="col-12 text-center py-5">
                <p class="text-muted">Нямате добавени обяви за наблюдение.</p>
              </div>
            </div>
          </div>

          <!-- Settings Tab -->
          <div class="tab-pane fade" id="v-pills-profile" role="tabpanel">
            <h2 class="h4 mb-4">Настройки на профила</h2>
            <div class="card shadow-sm border-0 mb-4">
              <div class="card-body p-4">
                <form id="company-profile-form">
                  <div class="row g-3">
                    <div class="col-md-6">
                      <label class="form-label fw-bold">Име на фирмата</label>
                      <input type="text" class="form-control" id="profile-company-name" required>
                    </div>
                    <div class="col-md-6">
                      <label class="form-label fw-bold">ЕИК / БУЛСТАТ</label>
                      <input type="text" class="form-control" id="profile-company-eik" readonly disabled>
                      <div class="form-text">ЕИК не може да се променя след регистрация.</div>
                    </div>
                    <div class="col-md-6">
                      <label class="form-label fw-bold">Град</label>
                      <input type="text" class="form-control" id="profile-company-city" required>
                    </div>
                    <div class="col-md-6">
                      <label class="form-label fw-bold">Телефон</label>
                      <input type="tel" class="form-control" id="profile-company-phone" required>
                    </div>
                    <div class="col-12">
                      <label class="form-label fw-bold">Адрес</label>
                      <input type="text" class="form-control" id="profile-company-address" required>
                    </div>
                    <div class="col-12">
                      <label class="form-label fw-bold">Описание на дейността</label>
                      <textarea class="form-control" id="profile-company-description" rows="4"></textarea>
                    </div>
                    <div class="col-12 mt-4">
                      <button type="submit" class="btn btn-primary px-4">
                        <i class="bi bi-save me-2"></i> Запази промените
                      </button>
                    </div>
                  </div>
                </form>

                <hr class="my-4">

                <div class="d-flex justify-content-between align-items-center">
                  <h5 class="mb-0">Сигурност</h5>
                  <button id="logout-btn" class="btn btn-outline-danger">
                    <i class="bi bi-box-arrow-right me-2"></i> Изход от акаунта
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Offer Modal -->
  <div class="modal fade" id="offerModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content border-0 shadow-lg rounded-4">
        <form id="submit-offer-form">
          <div class="modal-header bg-primary text-white p-4">
            <h5 class="modal-title fw-bold" data-i18n="offers.send_offer">Изпрати Оферта</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body p-4">
            <input type="hidden" id="modal-job-id">
            <div class="mb-3">
              <label class="form-label fw-bold" data-i18n="offers.price_label">Предложена Цена (лв.)</label>
              <input type="number" class="form-control" id="offer-price" required>
            </div>
            <div class="mb-3">
              <label class="form-label fw-bold" data-i18n="offers.message_label">Съобщение до клиента</label>
              <textarea class="form-control" id="offer-message" rows="4" required
                data-i18n-placeholder="offers.message_placeholder"></textarea>
            </div>
            <div class="mb-3">
              <label class="form-label fw-bold" data-i18n="offers.timeline_label">Срок за изпълнение (дни)</label>
              <input type="text" class="form-control" id="offer-duration">
            </div>
            <div class="mb-3">
              <label class="form-label fw-bold" data-i18n="offers.file_label">Прикачете документ (PDF, Word)</label>
              <input type="file" class="form-control" id="offer-file" accept=".pdf,.doc,.docx">
              <div class="form-text small" data-i18n="offers.file_hint">Опционално: Можете да добавите детайлна оферта
                или проект.</div>
            </div>
          </div>
          <div class="modal-footer border-0 p-4">
            <button type="button" class="btn btn-light px-4" data-bs-dismiss="modal"
              data-i18n="common.cancel">Отказ</button>
            <button type="submit" class="btn btn-primary px-4 bg-gradient-primary" data-i18n="offers.send_offer">Изпрати
              Оферта</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <div id="footer-container"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="/src/pages/company_dashboard.js"></script>
</body>

</html>
