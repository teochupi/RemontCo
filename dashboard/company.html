<!DOCTYPE html>
<html lang="bg">

<head>
    <meta charset="UTF-8">
    <title>Фирмен панел - RemontCo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
</head>

<body>
    <div class="container py-5">
        <h1>Панел за управление на фирма</h1>
        <div class="alert alert-info">Вашата фирма очаква верификация от администратор.</div>
        <div class="row mt-4">
            <div class="col-md-3">
                <div class="list-group">
                    <a href="#" class="list-group-item list-group-item-action active">Профил на фирмата</a>
                    <a href="#" class="list-group-item list-group-item-action">Услуги</a>
                    <a href="#" class="list-group-item list-group-item-action">Оферти</a>
                </div>
            </div>
            <div class="col-md-9">
                <div class="card p-4">
                    <h3>Данни на фирмата</h3>
                    <p>ЕИК: <span id="display-uic">Зарежда се...</span></p>
                </div>
            </div>
        </div>
        <button id="logout-btn" class="btn btn-danger mt-4">Изход</button>
    </div>
    <script type="module">
        import { authService } from '/src/js/services/authService.js';
        document.getElementById('logout-btn').addEventListener('click', async () => {
            await authService.signOut();
            window.location.href = '/';
        });
    </script>
</body>

</html>
